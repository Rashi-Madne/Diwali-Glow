
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Celebrate Diwali with Diwali Glow — a little world of light, warmth and happiness.">

    <title>Diwali Glow | Festival of Lights</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="celebration">

        <div class="stars" aria-hidden="true"></div>

        <section class="hero">

            <p class="eyebrow">A FESTIVAL OF LIGHTS</p>

            <h1>Happy Diwali</h1>

            <p class="subtitle">
                May your world shine brighter with every little light.
            </p>

            <div class="diya-container">
                <div class="flame"></div>
                <div class="diya">
                    <div class="diya-glow"></div>
                </div>
            </div>

            <button id="lightButton" type="button">
                Light the Diya
            </button>

            <p class="message" id="message">
                Let the light begin.
            </p>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
